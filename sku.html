<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU Generator for Rubian Coffee</title>
 <link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

rel="stylesheet"

>


<style>

body {

background: linear-gradient(135deg, #961212, #751c1c);

min-height: 100vh;

font-family: monospace

}


.container {

padding-top: 50px;

padding-bottom: 50px;

}


.main-card {

border: none;

border-radius: 20px;

overflow: hidden;

box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

}


.header {

background: #212529;

color: white;

padding: 30px;

text-align: center;

}


.info-card {

border: none;

border-radius: 15px;

height: 100%;

transition: transform 0.2s;

}


.info-card:hover {

transform: translateY(-5px);

}


.info-title {

color: #cf1a1a;

font-weight: bold;

}


.data-value {

font-size: 1.1rem;

}


.badge-custom {

background-color: #b41717;

}


footer {

text-align: center;

color: white;

margin-top: 30px;

}

</style>

</head>


<body>
<link rel="stylesheet" href="https://pyscript.net/" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <div class="container">

<div class="card main-card">
<div class="header">

  <h1> RUBIAN SKU Generator</h1>
</div>

  <hr>
  
<div class="card-body p-4">


<div class="row g-4">
<body>
  <label for="category">Product Category:</label>
  <input type="text" id="category" placeholder="e.g. COFFEE">


  <label for="name">Product Name:</label>
  <input type="text" id="name" placeholder="e.g. AMERICANO">


  <label for="quantity">Stock Quantity:</label>
  <input type="number" id="quantity" placeholder="e.g. 10">


  <button onclick="generateSKU()">Generate SKU</button>


  <div class="output" id="output">
    <p>Your SKU will appear here.</p>
  </div>
</div>
</div>

  
  <nav>
    
    <a href="Index.html">Back to Receipt Generator</a>
  </nav>

</BODY> 
  <script>
    function generateSKU() {
      let category = document.getElementById("category").value.trim().toUpperCase();
      let name = document.getElementById("name").value.trim().toUpperCase();
      let qty = document.getElementById("quantity").value.trim();


      if (!category || !name || !qty) {
        document.getElementById("output").innerHTML = "<p>Please fill all fields.</p>";
        return;
      }


      
      let random = Math.floor(Math.random() * 90 + 10);
      let sku = `${category}-${name}-${qty}${random}`;


      document.getElementById("output").innerHTML = `<p><strong>Generated SKU:</strong> ${sku}</p>`;
    }
  </script>


</body>
</html>
