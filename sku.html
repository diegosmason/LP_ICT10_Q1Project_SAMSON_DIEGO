<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>receipt maker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #961212, #751c1c);
      min-height: 100vh;
      font-family: monospace
    }

    .container {
      padding-top: 50px;
      padding-bottom: 50px;
    }

    .main-card {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .header {
      background: #212529;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .info-card {
      border: none;
      border-radius: 15px;
      height: 100%;
      transition: transform 0.2s;
    }

    .info-card:hover {
      transform: translateY(-5px);
    }

    .info-title {
      color: #cf1a1a;
      font-weight: bold;
    }

    .data-value {
      font-size: 1.1rem;
    }

    .badge-custom {
      background-color: #c91414;
    }

    footer {
      text-align: center;
      color: white;
      margin-top: 30px;
    }
  </style>

</head>


<body>  
  <script type="py" src="main.py"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <div class="container">

    <div class="card main-card">
   
      <div class="card-body p-4">
        <div class="row g-4">

            <h1> RUBIAN SKU Generator</h1>
</div>

  <hr>
  
<div class="card-body p-4">


<div class="row g-4">
<body>
  <label for="category">Product Category:</label>
  <input type="text" id="category" placeholder="e.g. COFFEE">


  <label for="name">Product Name:</label>
  <input type="text" id="product_name" placeholder="e.g. AMERICANO">


  <label for="quantity">Stock Quantity:</label>
  <input type="number" id="quantity" placeholder="e.g. 10">


  <button py-click="SKU_generator">Generate Sku
    
  </button>

        

          <p id="sku_output">Output</p>

          <a href="index.html">Go to Receipt maker</a>
        </div>
      </div>
    </div>
</body>

</html
